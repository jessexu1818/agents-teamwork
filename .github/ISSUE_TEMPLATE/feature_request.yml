name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: checkboxes
    id: requirements
    attributes:
      label: Requirements
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I write in English
          required: true
        - label: I provide the repo version/commit below
          required: true
        - label: I describe the problem and expected vs current behavior below
          required: true
  - type: input
    id: version
    attributes:
      label: Repo version / commit
      description: Tag or commit SHA you tested against.
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Include repro steps if relevant.
      placeholder: Problem and current behavior...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What do you want to happen (expected behavior)?
      placeholder: Proposed change...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Alternative solutions considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else. Do not include secrets.
    validations:
      required: false
