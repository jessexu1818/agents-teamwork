name: ci

"on":
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest

      - name: Run tests (if present)
        run: |
          if [ -d tests ]; then
            python3 -m pytest tests/ -q
          else
            echo "No tests directory, skipping."
          fi

      - name: Verify generated output (if present)
        run: |
          if [ -f scripts/generate.py ] && [ -f scripts/verify.py ]; then
            TMPDIR=$(mktemp -d)
            python3 scripts/generate.py --target "$TMPDIR/out" --tools all --extra planner,oracle,designer --preset pro
            python3 scripts/verify.py --target "$TMPDIR/out"
          else
            echo "No generator/verifier, skipping verify."
          fi

      - name: Shellcheck setup.sh (if present)
        run: |
          if [ -f setup.sh ]; then
            shellcheck setup.sh
          else
            echo "No setup.sh, skipping shellcheck."
          fi
